name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform 35
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null; "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Unit tests + debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVKey.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVKey-apk
          path: TVKey.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TVKey.apk
          generate_release_notes: true
          body: |
            **TVKey** — bàn phím tiếng Anh kiểu Google TV cho Android TV / Bliss OS.

            ### Cài đặt
            1. Tải `TVKey.apk` bên dưới và cài lên thiết bị.
            2. Mở TVKey → **1. Bật TVKey** → bật công tắc → **2. Chọn TVKey**.
            3. Mở ô nhập bất kỳ để dùng. Bấm **Back** để đóng bàn phím.

            APK ký bằng khóa debug. Xem README để biết cách dùng và xử lý sự cố.
